name: Generar PDFs de directorios

# Se ejecuta cuando alguien edita los CSV (o este script) en main.
# También se puede lanzar a mano desde la pestaña Actions -> "Run workflow".
on:
  push:
    branches: [main]
    paths:
      - "_data/delegaciones.csv"
      - "_data/grupos.csv"
      - "scripts/build_pdfs.py"
      - "assets/img/logo.png"
  workflow_dispatch:

permissions:
  contents: write   # para guardar los PDF en el repositorio
  pages: write      # para pedir un nuevo despliegue del sitio

concurrency:
  group: build-pdfs
  cancel-in-progress: true

jobs:
  pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Playwright y Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Generar PDFs
        run: python scripts/build_pdfs.py

      - name: Guardar PDFs en el repositorio
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/docs/*.pdf
          if git diff --cached --quiet; then
            echo "Sin cambios en los PDF."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Actualizar PDFs de directorios (automático)"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Los commits hechos con GITHUB_TOKEN no disparan otros workflows,
      # así que pedimos el despliegue de GitHub Pages explícitamente.
      - name: Desplegar sitio
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"