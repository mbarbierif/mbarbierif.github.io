---
layout: default
---

<div class="page-header">
  <div class="wrap fade-up">
    <div class="section-label">{% if page.categoria %}{{ page.categoria | capitalize }}{% else %}Novedad{% endif %}</div>
    <h1 class="page-header-title">{{ page.title }}</h1>
    <p class="page-header-desc">
      <span style="font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted);">
        {{ page.date | date: "%d de %B de %Y" }}
      </span>
    </p>
  </div>
</div>

<div class="section">
  <div class="wrap">
    <article class="post-content">
      {% if page.imagen %}
      <img src="{{ page.imagen | relative_url }}" alt="{{ page.title }}" style="width:100%; border-radius: var(--radius-lg); margin-bottom: 1.75rem;" />
      {% endif %}
      {{ content }}
    </article>
    <a href="{{ '/eventos/' | relative_url }}" class="btn btn-secondary" style="margin-top: 1.5rem;">← Volver</a>
  </div>
</div>
