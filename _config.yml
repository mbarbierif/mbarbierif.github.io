title: "Asociación Parasitológica Argentina"
description: "Entidad científica sin fines de lucro dedicada a la promoción y difusión de la Parasitología en Argentina y el mundo."
url: "https://apargentina.org.ar"
baseurl: ""

markdown: kramdown
highlighter: rouge
permalink: /:categories/:year/:month/:day/:title/

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

plugins:
  - jekyll-feed
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules

email: info@apargentina.org.ar
twitter: "@APA_Argentina"
revista_url: "http://www.revargparasitologia.com.ar/ojs/index.php/rap"

# Navegación — Opción B (5 secciones), aprobada por el equipo.
# "Revista" no es un ítem de nav: vive como link externo desde Inicio
# (tiene su propio sitio). "Delegados" vive dentro de La Asociación.
nav:
  - title: "La Asociación"
    url: "/asociacion/"
  - title: "Eventos"
    url: "/eventos/"
  - title: "Formación y Convocatorias"
    url: "/formacion-convocatorias/"
  - title: "Asociate"
    url: "/asociate/"
