title: "Asociación Parasitológica Argentina"
description: "Entidad científica sin fines de lucro dedicada a la promoción y difusión de la Parasitología en Argentina y el mundo."
url: "https://apargentina.org.ar"
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:year/:month/:day/:title/

# Collections
collections:
  posts:
    output: true

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Plugins (available natively in GitHub Pages)
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Exclude from build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules

# Site info
email: info@apargentina.org.ar
twitter: "@APA_Argentina"

# Navigation — Opción B (5 secciones), aprobada por el equipo
# Nota: "Revista" ya no es un ítem de nav — vive solo como link externo
# desde Inicio (revargparasitologia.com.ar tiene su propio sitio).
# "Delegados" pasó a vivir dentro de La Asociación (ver footer.html
# y pages/asociacion.html), no como ítem de nav propio.
nav:
  - title: "La Asociación"
    url: "/asociacion/"
  - title: "Eventos"
    url: "/eventos/"
  - title: "Formación y Convocatorias"
    url: "/formacion-convocatorias/"
  - title: "Asociate"
    url: "/asociate/"
