title: "Asociación Parasitológica Argentina"
description: "Entidad científica sin fines de lucro dedicada a la promoción y difusión de la Parasitología en Argentina y el mundo."
url: "https://apargentina.org.ar"
baseurl: ""

markdown: kramdown
highlighter: rouge
permalink: /:categories/:year/:month/:day/:title/

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

plugins:
  - jekyll-feed
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules

email: secretaria@apargentina.org.ar
revista_url: "http://www.revargparasitologia.com.ar/ojs/index.php/rap"

# Redes sociales (footer). Si un valor queda vacío (""), el botón no se muestra.
instagram_url: "https://www.instagram.com/asocparasitologicaargentina/"            # Instagram de la APA
revista_instagram_url: "https://www.instagram.com/revargparasitologia/"    # Instagram de la Revista
facebook_url: "https://www.facebook.com/share/1WZXD5F2YC/"             # Facebook de la APA

# Navegación — aprobada por el equipo.
# "Revista" no es un ítem de nav: vive como link externo desde Inicio
# (tiene su propio sitio). "Delegados" vive dentro de La Asociación.
# "Asociate" ya no es un ítem de nav: es el botón (CTA) al lado del menú,
# definido en _includes/header.html. "Contacto" es una sección nueva
# (página pendiente: pages/contacto.html).
nav:
  - title: "La Asociación"
    url: "/asociacion/"
  - title: "Eventos"
    url: "/eventos/"
  - title: "Formación y Convocatorias"
    url: "/formacion-convocatorias/"
  - title: "Contacto"
    url: "/contacto/"