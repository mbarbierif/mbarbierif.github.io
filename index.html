<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juli App</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: #0c0c0c;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }
  .logo {
    font-family: 'Anton', sans-serif;
    font-size: 48px;
    letter-spacing: 0.02em;
    margin-bottom: 6px;
  }
  .logo span { color: #C6FF3D; }
  .sub {
    color: #666;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 56px;
  }
  .iterations { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 320px; }
  .iter-btn {
    display: block;
    text-decoration: none;
    background: #fff;
    border-radius: 16px;
    padding: 24px 28px;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }
  .iter-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
  .iter-btn .num {
    font-family: 'Anton', sans-serif;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .iter-btn .title { font-size: 18px; font-weight: 700; margin-bottom: 6px; color: #111; }
  .iter-btn .desc { font-size: 12px; color: #555; line-height: 1.4; }
  .iter-btn .arrow {
    position: absolute;
    right: 24px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    color: #ccc;
    transition: all 0.2s ease;
  }
  .iter-btn:hover .arrow { color: #111; right: 20px; }

  .iter1 .num { color: #999; }
  .iter2 { background: #fff; }
  .iter2 .num { color: #0E7C7B; }
  .iter2 .title { color: #111; }
  .iter2 .desc { color: #555; }
  .iter2 .arrow { color: #ccc; }
  .iter2:hover .arrow { color: #111; }

  .footer { margin-top: 56px; font-size: 11px; color: #333; }
</style>
</head>
<body>
  <div class="logo">JULI<span>.</span></div>
  <div class="sub">Exploración de producto</div>

  <div class="iterations">
    <a href="iteration1.html" class="iter-btn iter1">
      <div class="num">Iteración 1</div>
      <div class="title">Estilos + Funcionalidades</div>
      <div class="desc">4 estilos visuales y 6 pantallas de funcionalidad en minimal.</div>
      <span class="arrow">→</span>
    </a>
    <a href="iteration2.html" class="iter-btn iter2">
      <div class="num">Iteración 2 — nueva</div>
      <div class="title">Home del alumno + Dashboard</div>
      <div class="desc">Energético y Divertido. Home de Cami, plan del día, y dashboard de Juli con perfiles de alumnas.</div>
      <span class="arrow">→</span>
    </a>
  </div>

  <div class="footer">hecho para Juli 💛</div>
</body>
</html>
